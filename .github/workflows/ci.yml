name: ci

# Testes em todo push e pull request. Numa tag v* (ex.: v1.0.0), publica a imagem no Docker Hub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes unitários, de arquitetura e da API
        run: mvn -B verify
      - name: Resumo dos testes (check run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resumo-surefire.sh ms-oportunidades target/surefire-reports
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-oportunidades-surefire
          path: target/surefire-reports

  # Secrets: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (token com permissão Read & Write).
  imagem:
    needs: testes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minicrm-ms-oportunidades:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/minicrm-ms-oportunidades:latest
